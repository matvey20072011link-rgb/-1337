name: Build Totem Counter Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Mod Archive (ZIP/JAR)
        uses: actions/upload-artifact@v4
        with:
          name: totemcounter-fabric-1.21.4
          path: build/libs/!(*-dev.jar|*-sources.jar) # Скачиваем только готовый мод
